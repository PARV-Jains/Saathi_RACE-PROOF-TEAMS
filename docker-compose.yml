services:
  postgres:
    image: postgres:16-alpine
    container_name: hackathon_team_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hackathon_teams
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d hackathon_teams" ]
      interval: 2s
      timeout: 3s
      retries: 10
